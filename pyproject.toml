[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-capacity-watchdog"
version = "0.2.1"
description = "A quiet capacity-error watchdog and terminal manager for Codex CLI sessions"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.scripts]
codex-watchdog = "codex_watchdog.tui:main"

[tool.setuptools.packages.find]
where = ["src"]
